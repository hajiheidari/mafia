# mafia.espadna.com: the narrator tool (static, Cloudflare Workers assets).
# Deployed by .github/workflows/web.yml; never run `wrangler deploy` by hand.
name = "mafia"
compatibility_date = "2026-10-01"
routes = [{ pattern = "mafia.espadna.com", custom_domain = true }]

[assets]
directory = "../build/tool"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
